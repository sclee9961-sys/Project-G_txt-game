<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>???</title>
    <!-- 스크립트가 로드되기 전에도 배경이 어둡게 보이도록, 그리고 로드에 실패했을 때 흰 화면으로 남지 않도록 한다. -->
    <style>
      body {
        margin: 0;
        background: #0b0b0c;
        color: #7d7d7d;
        font-family: 'Times New Roman', 'Batang', 'Noto Serif KR', serif;
      }
    </style>
  </head>
  <body>
    <div id="root">불러오는 중…</div>
    <noscript>JavaScript를 켜야 게임을 할 수 있습니다.</noscript>
    <!-- 게임 스크립트가 실패하면 빈 화면 대신 원인과 확인할 것을 보여준다. (모듈 스크립트보다 먼저 실행되는 일반 스크립트) -->
    <script>
      (function () {
        var shown = false
        function started() {
          var root = document.getElementById('root')
          // .game은 평소 화면, .scene은 COMPUTER 방 장면 시험 화면이다. 둘 다 React가 정상적으로
          // 그린 결과이니 "시작됨"으로 쳐야 한다.
          return !!(root && root.querySelector('.game, .scene'))
        }
        function show(detail) {
          var root = document.getElementById('root')
          if (shown || started() || !root) return
          shown = true
          var box = document.createElement('div')
          box.style.cssText = 'padding:16px;max-width:640px;line-height:1.7;white-space:pre-wrap;color:#d6d6d6'
          box.textContent =
            '게임을 시작하지 못했습니다.\n\n' +
            '원인: ' + detail + '\n' +
            '현재 주소: ' + location.href + '\n\n' +
            '확인해 주세요.\n' +
            '1. 터미널에서 npm run dev 를 실행하고, 터미널에 표시된 주소(예: http://127.0.0.1:5173/)로 접속했나요?\n' +
            '   index.html을 파일로 직접 열거나 Live Server 같은 다른 서버로 열면 동작하지 않습니다.\n' +
            '2. 광고 차단(uBlock, AdBlock 등) 확장 프로그램을 끄거나, 시크릿(사생활 보호) 창에서 열어 보세요.\n' +
            '3. F12 → 콘솔(Console)에 빨간 오류가 있으면 알려 주세요.'
          root.textContent = ''
          root.appendChild(box)
        }
        // 오류(스크립트 파일을 못 불러온 경우 포함). 리소스 오류는 버블링되지 않아 capture로 받는다.
        window.addEventListener('error', function (e) {
          var t = e.target
          // 그림 한 장이 빠진 것은 게임 시작 실패가 아니다. 스크립트·스타일 파일을 못 불러온 경우만 안내한다.
          if (t && t !== window && t.tagName !== 'SCRIPT' && t.tagName !== 'LINK') return
          show(t && t !== window && (t.src || t.href) ? '파일을 불러오지 못했습니다: ' + (t.src || t.href) + '\n        (이 파일이 불러오는 다른 파일이 차단된 것일 수도 있습니다)' : e.message + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''))
        }, true)
        window.addEventListener('unhandledrejection', function (e) {
          show(String((e.reason && (e.reason.message || e.reason)) || 'unhandledrejection'))
        })
        setTimeout(function () {
          if (!started()) show('5초가 지나도 게임이 시작되지 않았습니다.')
        }, 5000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
